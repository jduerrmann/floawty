# `npm run check` and the release build, for every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Every commit on main keeps its own result; a newer push only replaces an older pull request run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # rustup reads rust-toolchain.toml and installs the pinned version with clippy and rustfmt.
      - name: Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            src-tauri
            tools/test-input
          # Red runs are expected while CI settles; without this each one builds cold.
          cache-on-failure: true

      - run: npm ci
      - run: npm run check

      # Cargo has no --locked through the npm scripts; check resolved both workspaces, so a stale lockfile shows here.
      - name: Cargo lockfiles unchanged
        run: git diff --exit-code -- src-tauri/Cargo.lock tools/test-input/Cargo.lock

      # No app tests here: WebView2 cannot create its window on the runner's hidden desktop
      # (0x80070578), so `npm run verify` runs them locally before a merge or release.
      - run: npm run build
