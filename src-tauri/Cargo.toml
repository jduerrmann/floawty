[package]
name = "floawty"
version = "0.1.0-rc.1"
description = "Watch streaming services in a small always-on-top overlay"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
# Pinned to one minor version; an upgrade is its own task (AGENTS.md rule 7).
tauri-build = { version = "~2.7", features = [] }

[dependencies]
# "unstable" allows the service webview inside the main window.
tauri = { version = "~2.12", features = ["unstable"] }
# Already in the tree through Tauri; listed so the settings file can use them directly.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tauri-plugin-global-shortcut = "~2.4"
# Updates by click; native-tls uses Windows' own TLS, system-proxy its proxy settings.
tauri-plugin-updater = { version = "~2.14", default-features = false, features = ["native-tls", "system-proxy"] }
# Tauri's own WebView2 bindings, same version; floawty handles a page's fullscreen itself.
webview2-com = "~0.39.1"
# Its `cast` reaches newer WebView2 interfaces: muting a service kept awake out of sight.
windows-core = "~0.62.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Dwm", "Win32_Security", "Win32_System_Threading", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
