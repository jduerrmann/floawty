<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>floawty</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./tiles.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main id="home" class="home" data-tauri-drag-region>
      <div id="notice" class="notice-ground" data-tauri-drag-region hidden>
        <section class="notice" role="dialog" aria-modal="true" aria-labelledby="notice-text">
          <p id="notice-text" tabindex="0"></p>
          <button id="notice-ok" type="button" class="button primary"></button>
        </section>
      </div>
      <div id="tiles-area" class="tiles-area" data-tauri-drag-region>
        <ul id="tiles" class="tiles"></ul>
      </div>
      <form id="tile-form" class="tile-form" hidden>
        <label><span id="tile-name-label"></span><input id="tile-name" maxlength="80" /></label>
        <label><span id="tile-url-label"></span><input id="tile-url" inputmode="url" /></label>
        <p id="tile-error" class="tile-error" role="alert"></p>
        <div class="tile-form-actions">
          <button id="tile-cancel" type="button" class="button"></button>
          <button id="tile-save" type="submit" class="button primary"></button>
        </div>
      </form>
      <p id="about" class="about" data-tauri-drag-region>floawty</p>
    </main>
    <section id="settings-panel" class="settings" aria-labelledby="settings-title" hidden>
      <header class="settings-header" data-tauri-drag-region>
        <h1 id="settings-title" data-tauri-drag-region></h1>
        <button id="settings-done" type="button" class="button primary"></button>
      </header>
      <section class="card" aria-labelledby="general-title">
        <h2 id="general-title"></h2>
        <div class="setting">
          <label id="language-label" for="language"></label>
          <select id="language">
            <option value="system"></option>
            <option value="en"></option>
            <option value="de"></option>
          </select>
        </div>
        <div class="setting">
          <span id="theme-label"></span>
          <div id="theme" class="segments" role="radiogroup" aria-labelledby="theme-label">
            <label
              ><input type="radio" name="theme" value="system" /><span id="theme-system"></span
            ></label>
            <label
              ><input type="radio" name="theme" value="light" /><span id="theme-light"></span
            ></label>
            <label
              ><input type="radio" name="theme" value="dark" /><span id="theme-dark"></span
            ></label>
          </div>
        </div>
        <div class="setting">
          <div class="setting-text">
            <label id="animations-label" for="animations"></label>
            <p id="animations-note" class="setting-note"></p>
          </div>
          <input
            id="animations"
            class="switch"
            type="checkbox"
            role="switch"
            aria-describedby="animations-note"
          />
        </div>
        <div class="setting">
          <div class="setting-text">
            <label id="update-check-label" for="update-check"></label>
            <p id="update-check-note" class="setting-note"></p>
          </div>
          <input
            id="update-check"
            class="switch"
            type="checkbox"
            role="switch"
            aria-describedby="update-check-note"
          />
        </div>
        <div class="setting">
          <div class="setting-text">
            <label id="graphics-acceleration-label" for="graphics-acceleration"></label>
            <p id="graphics-acceleration-note" class="setting-note"></p>
          </div>
          <input
            id="graphics-acceleration"
            class="switch"
            type="checkbox"
            role="switch"
            aria-describedby="graphics-acceleration-note"
          />
        </div>
        <div
          id="restart-confirm"
          class="setting-confirm"
          role="group"
          aria-labelledby="restart-question"
          hidden
        >
          <p id="restart-question"></p>
          <div class="setting-actions">
            <button id="restart-no" type="button" class="button"></button>
            <button id="restart-yes" type="button" class="button primary"></button>
          </div>
        </div>
      </section>
      <section class="card" aria-labelledby="hotkeys-title">
        <h2 id="hotkeys-title"></h2>
        <div id="hotkey-list" class="hotkey-list"></div>
        <p id="hotkey-error" class="setting-error" role="alert"></p>
      </section>
      <section class="card" aria-labelledby="shorts-title">
        <h2 id="shorts-title"></h2>
        <div class="setting">
          <label id="shorts-pause-label" for="shorts-pause"></label>
          <input id="shorts-pause" type="number" min="0" max="10" step="0.5" />
        </div>
        <div class="setting">
          <label id="shorts-hold-label" for="shorts-hold"></label>
          <input id="shorts-hold" class="switch" type="checkbox" role="switch" />
        </div>
        <div class="setting">
          <label id="portrait-size-label" for="portrait-size"></label>
          <select id="portrait-size">
            <option value="rotated"></option>
            <option value="separate"></option>
          </select>
        </div>
      </section>
      <section class="card" aria-labelledby="data-title">
        <h2 id="data-title"></h2>
        <div class="setting">
          <p id="reset-explain" class="setting-note"></p>
          <button id="reset" type="button" class="button"></button>
        </div>
        <div id="reset-confirm" class="setting-actions" hidden>
          <button id="reset-no" type="button" class="button"></button>
          <button id="reset-yes" type="button" class="button danger"></button>
        </div>
      </section>
      <p id="trademark-note" class="settings-footnote"></p>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
