<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>floawty</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="stylesheet" href="./tiles.css" />
    <link rel="stylesheet" href="./settings.css" />
  </head>
  <body>
    <main id="home" class="home" data-tauri-drag-region>
      <section id="notice" class="notice" hidden>
        <p id="notice-text"></p>
        <button id="notice-ok" type="button" class="button primary"></button>
      </section>
      <div class="tiles-area" data-tauri-drag-region><ul id="tiles" class="tiles"></ul></div>
      <form id="tile-form" class="tile-form" hidden>
        <label><span id="tile-name-label"></span><input id="tile-name" maxlength="80" /></label>
        <label><span id="tile-url-label"></span><input id="tile-url" inputmode="url" /></label>
        <p id="tile-error" class="tile-error" role="alert"></p>
        <div class="tile-form-actions">
          <button id="tile-cancel" type="button" class="button"></button>
          <button id="tile-save" type="submit" class="button primary"></button>
        </div>
      </form>
      <p id="about" class="about" data-tauri-drag-region>floawty</p>
    </main>
    <section id="settings-panel" class="settings" aria-labelledby="settings-title" hidden>
      <header class="settings-header" data-tauri-drag-region>
        <h1 id="settings-title" data-tauri-drag-region></h1>
        <button id="settings-done" type="button"></button>
      </header>
      <label class="setting">
        <span id="language-label"></span>
        <select id="language">
          <option value="system"></option>
          <option value="en"></option>
          <option value="de"></option>
        </select>
      </label>
      <fieldset class="setting-group">
        <legend id="hotkeys-title"></legend>
        <div id="hotkey-list" class="hotkey-list"></div>
        <p id="hotkey-error" class="setting-error" role="alert"></p>
      </fieldset>
      <fieldset class="setting-group">
        <legend id="shorts-title"></legend>
        <label class="setting">
          <span id="shorts-pause-label"></span>
          <input id="shorts-pause" type="number" min="0" max="10" step="0.5" />
        </label>
        <label class="setting-check">
          <input id="shorts-hold" type="checkbox" />
          <span id="shorts-hold-label"></span>
        </label>
        <label class="setting">
          <span id="portrait-size-label"></span>
          <select id="portrait-size">
            <option value="rotated"></option>
            <option value="separate"></option>
          </select>
        </label>
      </fieldset>
      <div class="setting-group">
        <label class="setting-check">
          <input id="update-check" type="checkbox" aria-describedby="update-check-note" />
          <span id="update-check-label"></span>
        </label>
        <p id="update-check-note" class="setting-note"></p>
      </div>
      <div class="setting-group">
        <label class="setting-check">
          <input
            id="graphics-acceleration"
            type="checkbox"
            aria-describedby="graphics-acceleration-note"
          />
          <span id="graphics-acceleration-label"></span>
        </label>
        <p id="graphics-acceleration-note" class="setting-note"></p>
        <div id="restart-confirm" role="group" aria-labelledby="restart-question" hidden>
          <p id="restart-question" class="setting-note"></p>
          <div class="setting-actions">
            <button id="restart-yes" type="button"></button>
            <button id="restart-no" type="button"></button>
          </div>
        </div>
      </div>
      <fieldset class="setting-group">
        <legend id="reset-title"></legend>
        <p id="reset-explain" class="setting-note"></p>
        <button id="reset" type="button"></button>
        <div id="reset-confirm" class="setting-actions" hidden>
          <button id="reset-yes" type="button" class="danger"></button>
          <button id="reset-no" type="button"></button>
        </div>
      </fieldset>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
