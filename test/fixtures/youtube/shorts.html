<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Short fixture</title>
    <style>
      #masthead-container {
        position: fixed;
        inset: 0 0 auto 0;
        height: 56px;
        z-index: 2020;
      }
      /* Like YouTube, the list of Shorts scrolls and snaps one Short at a time. */
      #shorts-container {
        margin-top: 56px;
        height: 600px;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
      }
      .reel {
        position: relative;
        display: flex;
        width: 400px;
        height: 600px;
        margin-bottom: 16px;
        scroll-snap-align: start;
        contain: size layout;
      }
      /* Overlays lie over the whole Short, as YouTube's buttons and titles do. */
      .reel .cover {
        position: absolute;
        inset: 0;
        z-index: 1;
      }
      #shorts-player {
        position: relative;
        z-index: 0;
        width: 300px;
        height: 560px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="masthead-container">YouTube</div>
    <ytd-shorts>
      <div id="shorts-container">
        <!-- As on YouTube (2026-11-20): helpers that never snap around the snapping Short boxes. -->
        <div id="shorts-inner-container">
          <div id="initial-player-container"></div>
          <dom-repeat></dom-repeat>
          <!-- The nesting of a Short as on YouTube; each level holds overlays beside the player. -->
          <div class="reel-video-in-sequence-new reel">
            <div class="reel-video-in-sequence-thumbnail"></div>
            <div id="reel-overlay-container">
              <ytd-reel-video-renderer>
                <div id="short-video-container">
                  <div id="sticker-layer" class="cover"></div>
                  <div class="player-wrapper">
                    <div id="player-container">
                      <ytd-player
                        ><div id="shorts-player"><video loop></video></div
                      ></ytd-player>
                      <!-- As live (2026-11-21): YouTube's row over the video's top, its seek bar below the Short. -->
                      <div
                        class="player-controls"
                        style="
                          position: absolute;
                          top: 25px;
                          left: -23px;
                          width: 446px;
                          height: 72px;
                          z-index: 1;
                        "
                      >
                        <button id="yt-play" style="height: 48px">Pause</button
                        ><button id="yt-mute" style="height: 48px">Mute</button
                        ><input id="volume-input" type="range" /><button
                          id="yt-more"
                          style="height: 48px"
                        >
                          More
                        </button>
                      </div>
                      <div id="beside-player" class="cover">
                        <span id="beside-player-text">Beside</span>
                      </div>
                    </div>
                    <div
                      id="scrubber"
                      style="position: absolute; top: 100%; left: -23px; width: 446px; height: 3px"
                    >
                      <yt-progress-bar
                        style="display: block; position: relative; top: -14px; height: 24px"
                      ></yt-progress-bar>
                    </div>
                    <div id="beside-wrapper" class="cover">
                      <span id="beside-wrapper-text">Beside</span>
                    </div>
                  </div>
                </div>
                <div id="experiment-overlay" class="cover">
                  <!-- YouTube's overlay parts set their own visibility, undoing a hidden parent. -->
                  <div
                    id="self-visible"
                    class="cover"
                    style="visibility: visible; pointer-events: auto"
                  >
                    Comments
                  </div>
                </div>
              </ytd-reel-video-renderer>
              <div id="actions" class="cover">Share</div>
              <!-- On ad Shorts YouTube shows its ad card here, beside the player. -->
              <div
                id="ads-overlay"
                hidden
                style="position: absolute; left: 8px; bottom: 8px; width: 200px; height: 120px"
              >
                <span id="ad-card">Sponsored</span>
              </div>
            </div>
          </div>
          <!-- A Short the player has left keeps YouTube's row and bar at their own places. -->
          <div class="reel-video-in-sequence-new reel">
            <div id="reel-overlay-container">
              <ytd-reel-video-renderer>
                <div id="short-video-container">
                  <div class="player-wrapper">
                    <div id="player-container">
                      <div class="player-controls"><button id="left-play">Pause</button></div>
                    </div>
                    <div id="scrubber"><yt-progress-bar id="left-bar">bar</yt-progress-bar></div>
                  </div>
                </div>
              </ytd-reel-video-renderer>
            </div>
          </div>
          <div class="reel-video-in-sequence-new reel"></div>
          <div class="reel-video-in-sequence-new reel"></div>
          <div id="overlay-initial-container" style="height: 40px"></div>
        </div>
      </div>
      <ytd-popup-container>
        <div id="dialog" hidden style="position: fixed; inset: 20%; z-index: 2202">Dialog</div>
      </ytd-popup-container>
      <div id="navigation-button-down"><button aria-label="Next"></button></div>
    </ytd-shorts>
    <script>
      const video = document.querySelector('video');
      let shortNumber = 0;
      window.__calls = [];
      document.querySelector('#navigation-button-down button').addEventListener('click', () => {
        window.__calls.push({ name: 'advance', at: Date.now() });
        shortNumber += 1;
        history.pushState({}, '', '/shorts/short' + shortNumber);
        video.dispatchEvent(new Event('loadstart'));
      });
    </script>
  </body>
</html>
